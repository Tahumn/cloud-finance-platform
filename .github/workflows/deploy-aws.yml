name: Deploy AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy all ECS services
        shell: bash
        run: |
          set -euo pipefail

          services=(
            auth
            finance
            notifications
            notifications-worker
            planning
            recurring
            ocr
            ai
            gateway
          )

          for name in "${services[@]}"; do
            family="cloud-finance-$name"
            service="cloud-finance-$name"

            aws ecs describe-task-definition \
              --task-definition "$family" \
              --region "$AWS_REGION" \
              --query taskDefinition \
              > current-task.json

            jq --arg image "$IMAGE_URI" --arg container "$name" '
              .containerDefinitions |= map(
                if .name == $container then .image = $image else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ' current-task.json > next-task.json

            new_task_arn=$(aws ecs register-task-definition \
              --cli-input-json file://next-task.json \
              --region "$AWS_REGION" \
              --query "taskDefinition.taskDefinitionArn" \
              --output text)

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service" \
              --task-definition "$new_task_arn" \
              --force-new-deployment \
              --region "$AWS_REGION" \
              > /dev/null
          done

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services \
              cloud-finance-auth \
              cloud-finance-finance \
              cloud-finance-notifications \
              cloud-finance-notifications-worker \
              cloud-finance-planning \
              cloud-finance-recurring \
              cloud-finance-ocr \
              cloud-finance-ai \
              cloud-finance-gateway \
            --region "$AWS_REGION"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Upload immutable frontend files
        run: |
          aws s3 sync frontend/dist \
            "s3://$FRONTEND_BUCKET" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable" \
            --region "$AWS_REGION"

      - name: Upload index without browser cache
        run: |
          aws s3 cp frontend/dist/index.html \
            "s3://$FRONTEND_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"